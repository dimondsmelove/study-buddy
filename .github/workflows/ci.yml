name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:backend
      - run: npm run contracts
      - run: npm run contracts:prompts
      - run: npm run contracts:context
      - run: npm run contracts:backend
      - run: npm run backend:build
      - run: npm run build

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run contracts:storage
      - run: node --experimental-strip-types scripts/welcome-contracts.mjs
      - run: npm run verify
      - name: Build an HTTPS gateway artifact
        run: npm run build -- --outDir review/ci-release
        env:
          STUDY_BUDDY_GATEWAY_URL: https://api.example.invalid
      - run: npm run verify -- --extension-dir review/ci-release

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Study Buddy</title>
    <link rel="stylesheet" href="./chat.css" />
  </head>
  <body>
    <main id="app">
      <p id="operation-error" role="alert" hidden></p>
      <section id="view-capture" hidden>
        <nav id="capture-top" data-i18n-aria="capture.tools">
          <span id="conversation-title"></span>
          <button type="button" id="history-btn" class="icon-button" data-i18n-title="dialog.history" data-i18n-aria="dialog.history">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/><circle cx="18" cy="17" r="3"/><path d="M18 15.5v1.7l1 .6"/></svg>
          </button>
          <button type="button" id="new-selection-btn" class="icon-button" data-i18n-title="capture.newSelection" data-i18n-aria="capture.newSelection"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4"/><path d="M8 8h8v8H8z"/></svg></button>
          <button type="button" id="new-chat-btn" class="toolbar-text-button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span data-i18n="dialog.new"></span></button>
          <!--
          <button type="button" id="settings-btn" class="icon-button" data-i18n-title="capture.settings" data-i18n-aria="capture.settings">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"/><path d="m19 13.5 1.2 1-.9 1.6-1.5-.4a7 7 0 0 1-1.2.8l-.3 1.6h-2l-.6-1.5a7 7 0 0 1-1.5 0l-.8 1.3-1.7-.7.2-1.6a7 7 0 0 1-1-1.1l-1.6.1-.6-1.8 1.3-.9a7 7 0 0 1 0-1.5l-1.2-1 .9-1.6 1.5.4a7 7 0 0 1 1.2-.8l.3-1.6h2l.6 1.5a7 7 0 0 1 1.5 0l.8-1.3 1.7.7-.2 1.6a7 7 0 0 1 1 1.1l1.6-.1.6 1.8-1.3.9a7 7 0 0 1 0 1.5Z"/></svg>
          </button>
          -->
        </nav>
        <div id="presets" role="group" data-i18n-aria="capture.actions">
          <button type="button" class="preset" data-preset="solve" data-task-help="task.solve"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="3"/><path d="M8 7h8M8 11h2m4 0h2M8 15h2m4 0h2M8 18h2m4 0h2"/></svg><span data-i18n="preset.solve"></span></button>
          <button type="button" class="preset" data-preset="hint" data-task-help="task.hint"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6m-5 3h4M8.5 14.5a6 6 0 1 1 7 0c-1 .7-1.5 1.5-1.5 3.5h-4c0-2-.5-2.8-1.5-3.5Z"/></svg><span data-i18n="preset.hint"></span></button>
          <button type="button" class="preset" id="check-btn" data-task-help="task.check"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg><span data-i18n="preset.check"></span></button>
          <button type="button" class="preset" data-preset="explain" data-task-help="task.explain"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6c-3-2-6-2-9-1v14c3-1 6-1 9 1m0-14c3-2 6-2 9-1v14c-3-1-6-1-9 1V6Z"/></svg><span data-i18n="preset.explain"></span></button>
          <button type="button" class="preset" data-preset="translate" data-task-help="task.translate"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h12M9 3v2M5 5c1 5 4 8 8 10M13 5c-1 5-4 8-9 10m9 6 4-10 4 10m-6.5-4h5"/></svg><span data-i18n="preset.translate"></span></button>
          <button type="button" class="preset" data-preset="summarize" data-task-help="task.summarize"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h14M5 10h14M5 14h9M5 18h6"/></svg><span data-i18n="preset.summarize"></span></button>
        </div>
        <p id="context-warning" hidden role="status"></p>
        <div id="task-tooltip" popover="auto" role="tooltip"></div>
        <div id="thread" aria-live="polite"></div>
        <p id="dialog-status" role="status"></p>
        <div id="composer">
          <p id="composer-error" role="alert" hidden></p>
          <form id="ask-form" autocomplete="off">
            <input id="ask-input" type="text" data-i18n-placeholder="ask.placeholder" />
            <button id="ask-btn" type="submit" class="primary-action icon-button" data-i18n-title="ask.button" data-i18n-aria="ask.button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 18-8-8 18-2-8-8-2Z"/><path d="m11 13 4-4"/></svg></button>
          </form>
        </div>
      </section>

      <section id="view-history" hidden>
        <header class="view-heading"><h1 data-i18n="dialog.history"></h1><span class="heading-spacer"></span></header>
        <p class="set-note" data-i18n="dialog.retention"></p>
        <div id="history-list"></div>
        <p id="storage-usage"></p>
        <button id="history-back" type="button" data-i18n="settings.back"></button>
        <dialog id="delete-dialog" aria-labelledby="delete-title">
          <h2 id="delete-title" data-i18n="dialog.deleteTitle"></h2>
          <p id="delete-message"></p>
          <p id="delete-error" role="alert" hidden></p>
          <div class="delete-actions">
            <button id="delete-cancel" type="button" data-i18n="dialog.cancel"></button>
            <button id="delete-confirm" type="button" class="danger-action" data-i18n="dialog.delete"></button>
          </div>
        </dialog>
      </section>

      <section id="view-permission" hidden>
        <h1 data-i18n="state.permissionTitle"></h1>
        <p id="perm-text"></p>
        <button id="perm-btn" type="button" class="primary-action" data-i18n="state.allow"></button>
        <button type="button" class="ghost-settings" data-goto-settings data-i18n="state.settingsLink"></button>
      </section>

      <section id="view-restricted" hidden>
        <h1 data-i18n="state.restrictedTitle"></h1>
        <p id="restricted-text"></p>
        <button type="button" class="ghost-settings" data-goto-settings data-i18n="state.settingsLink"></button>
      </section>

      <section id="view-error" hidden>
        <h1 data-i18n="state.errorTitle"></h1>
        <p id="error-text"></p>
        <button type="button" class="ghost-settings" data-goto-settings data-i18n="state.settingsLink"></button>
      </section>

      <section id="view-settings" hidden>
        <h1 data-i18n="settings.title"></h1>
        <label for="set-ui-lang" data-i18n="settings.uiLanguage"></label>
        <select id="set-ui-lang"></select>
        <label for="set-ans-lang" data-i18n="settings.answerLanguage"></label>
        <select id="set-ans-lang"></select>
        <p id="set-msg" role="status"></p>
        <div id="set-actions">
          <button type="button" id="set-back" data-i18n="settings.back"></button>
          <button type="button" id="set-save" class="primary-action" data-i18n="settings.save"></button>
        </div>
      </section>
    </main>
    <dialog id="lightbox" data-i18n-aria="dialog.imagePreview">
      <button type="button" id="lightbox-close" class="icon-button" data-i18n-title="dialog.closePreview" data-i18n-aria="dialog.closePreview">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
      </button>
      <img data-i18n-alt="dialog.attachment" alt="Task image" />
    </dialog>
    <script type="module" src="./chat.ts"></script>
  </body>
</html>

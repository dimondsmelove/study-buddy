<!doctype html>
<html lang="en">
<head>

  <title>Study Buddy Installed</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">

<body data-mode="pin">
  <main class="page">
    <h1 id="page-title">Study Buddy Installed</h1>

    <section id="pin" aria-labelledby="pin-instruction">
      <p class="instruction" id="pin-instruction">Click the puzzle piece (1) in the top right of your browser. Then, click the little pin (2) next to the extension:</p>

          <rect x="999" y="89" width="100" height="60" fill="#fff" />

            </filter>
            <clipPath id="pin-study-buddy-row" clipPathUnits="userSpaceOnUse"><rect x="683" y="208" width="320" height="42" /></clipPath>

              <rect x="842" y="383" width="30" height="36" />

          <rect x="706" y="213" width="20" height="22" fill="#fff" />
          <image href="./assets/study-buddy-hat-tile.svg" x="708" y="216" width="16" height="16" preserveAspectRatio="xMidYMid meet" />

          <rect x="398" y="451" width="296" height="48" fill="#fff" />
          <rect x="0" y="531" width="1099" height="29" fill="#fff" />
          <circle cx="549.5" cy="501" r="20" fill="#d8e6ff" />

        </svg>
        <svg class="frame-annotations" viewBox="0 0 1099 560" aria-hidden="true" focusable="false">
 <g fill="#e50916">

 <g aria-hidden="true"><g transform="translate(955 60) rotate(-146) scale(0.09) translate(-98 -524)"><image href="./assets/curved-red-arrow.svg" x="0" y="0" width="797" height="798" preserveAspectRatio="xMidYMid meet"/></g><g transform="translate(948 226) rotate(48) scale(0.085) translate(-98 -524)"><image href="./assets/curved-red-arrow.svg" x="0" y="0" width="797" height="798" preserveAspectRatio="xMidYMid meet"/></g></g>
</svg>
      </figure>
    </section>

    <section id="usage" class="open-guide" aria-labelledby="open-instruction" data-usage-guide>
      <p class="instruction" id="open-instruction">Click the pinned Study Buddy icon (1), then select the problem (2):</p>
      <figure class="screenshot"><img src="./scene-1.png" alt="A Chrome window shows the Study Buddy icon and the equation selected with Study Buddy."></figure>
      <p class="instruction">Click Solve (3):</p>
      <figure class="screenshot"><img src="./scene-2.png" alt="The same Chrome window shows the captured equation and completed worked solution in Study Buddy."></figure>
    </section>

    <p class="mode-link pin-mode-link"><a href="#usage" data-switch="usage">Already pinned? Start using it</a></p>
    <p class="mode-link usage-mode-link"><a href="#pin" data-switch="pin">Don't see the icon? Show how to pin it</a></p>
  </main>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Study Buddy Installed</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <main class="page">
    <h1 id="page-title">Study Buddy Installed</h1>

    <section id="pin-guide" aria-labelledby="pin-instruction">
      <p class="instruction" id="pin-instruction">Click the puzzle piece (1) in the top right of your browser. Then, click the little pin (2) next to the extension:</p>
      <figure class="screenshot">
        <img src="./pin-toolbar.png" alt="Chrome’s Extensions menu is open with Study Buddy listed and its pin control visible.">
        <svg class="frame-cleanup pin-cleanup" viewBox="0 0 1099 560" aria-hidden="true" focusable="false">
          <rect x="46" y="9" width="83" height="25" fill="#fff" />
          <rect x="120" y="47" width="800" height="31" rx="15" fill="#edf2fa" />
          <rect x="999" y="89" width="100" height="60" fill="#fff" />
          <rect x="683" y="132" width="320" height="76" fill="#fff" />
          <rect x="687" y="249" width="312" height="35" fill="#fff" />
          <rect x="785" y="383" width="101" height="36" rx="18" fill="#fff" />
          <rect x="398" y="451" width="296" height="48" fill="#fff" />
          <rect x="0" y="531" width="1099" height="29" fill="#fff" />
          <circle cx="549.5" cy="501" r="20" fill="#d8e6ff" />
          <path d="M549.5 493v16m-8-8h16" stroke="#202124" stroke-width="1.8" stroke-linecap="round" />
        </svg>
      </figure>
    </section>

    <section class="open-guide" aria-labelledby="open-instruction">
      <p class="instruction" id="open-instruction">Open the extension (3) on any page to start using Study Buddy:</p>
      <figure class="screenshot">
        <img src="./open-toolbar.png" alt="Study Buddy’s icon is pinned in Chrome’s toolbar on a Google page.">
        <svg class="frame-cleanup open-cleanup" viewBox="0 0 1099 560" aria-hidden="true" focusable="false">
          <rect x="46" y="9" width="83" height="25" fill="#fff" />
          <rect x="120" y="47" width="800" height="31" rx="15" fill="#edf2fa" />
          <rect x="830" y="90" width="269" height="55" fill="#fff" />
          <rect x="785" y="383" width="101" height="36" rx="18" fill="#fff" />
          <rect x="398" y="451" width="296" height="48" fill="#fff" />
          <rect x="0" y="531" width="1099" height="29" fill="#fff" />
          <circle cx="549.5" cy="501" r="20" fill="#d8e6ff" />
          <path d="M549.5 493v16m-8-8h16" stroke="#202124" stroke-width="1.8" stroke-linecap="round" />
        </svg>
      </figure>
    </section>

    <button id="show-pin-guide" class="text-button" type="button" aria-expanded="false" hidden>Show how to pin it</button>
  </main>
</body>
</html>
